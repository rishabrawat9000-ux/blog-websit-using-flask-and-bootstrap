{%extends "layout.html"%}
{%block body%}
<header class="masthead" style="background-image: url('{{ url_for('static', filename='assets/img/admin-bg.jpg') }}')">
            <div class="container position-relative px-4 px-lg-5">
                <div class="row gx-4 gx-lg-5 justify-content-center">
                    <div class="col-md-10 col-lg-8 col-xl-7">
                        <div class="site-heading">
                            <h1>ADMIN PANEL</h1>
                            
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <!-- Main Content-->

        
        <div class="container px-4 px-lg-5">
            <div class="row gx-4 gx-lg-5 justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-7">
                    <!-- Post preview-->


<h3>Add/Edit Files</h3>
<form id="contactForm" action="{{ url_for('edit', sno=sno) }}" method="POST">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <div class="form-floating">
                                    <input class="form-control" id="title" type="text" name='title' placeholder="Enter title..." value="{{ post.title if post else '' }}" required/>
                                    <label for="name">Title</label>
                                    <div class="invalid-feedback" data-sb-feedback="name:required">A name is required.</div>
                                </div>

                                <div class="form-floating">
                                    <input class="form-control" id="slug" type="text" name='slug' placeholder="enter a slug..." value="{{ post.slug if post else '' }}" required />
                                    <label for="email">slug</label>
                                </div>


                                <div class="form-floating">
                                    <input class="form-control" id="img_file" type="text" name='img_file' placeholder="enter name of image..." value="{{ post.img_file if post else '' }}" required />
                                    <label for="email">image file</label>
                                

                                
                                </div>
                                <div class="form-floating">
                                    <input class="form-control" id="author" name="author" type="text" placeholder="Enter your name..." value="{{ post.author if post else '' }}" required/>
                                    <label for="phone">authur</label>
                                </div>
                                <div class="form-floating">
                                    <textarea class="form-control" id="content" name="content" placeholder="start typing..." style="height: 12rem" required>{{ post.content if post else '' }}</textarea>
                                    <label for="message">content</label>
                                </div>
                            
                                <div>

                                <button class="btn btn-primary text-uppercase" id="submitButton" type="submit"> SAVE </button>
                                </div>
                            
                            </form>
        {%endblock%}
