{%extends "layout.html"%}
{%block body%}
<header class="masthead" style="background-image: url('{{ url_for('static', filename='assets/img/admin-bg.jpg') }}')">
            <div class="container position-relative px-4 px-lg-5">
                <div class="row gx-4 gx-lg-5 justify-content-center">
                    <div class="col-md-10 col-lg-8 col-xl-7">
                        <div class="site-heading">
                            <h1>ADMIN PANEL</h1>
                            <span class="subheading">Thoughts worth sharing,Stories worth reading</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <!-- Main Content-->

        
        <div class="container px-4 px-lg-5">
            <div class="row gx-4 gx-lg-5 justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-7">
                    <!-- Post preview-->
<h3>Post new files</h3>
<div>
    todo
</div>

<h3>Edit Files</h3>
<table class="table">
  <thead>
    <tr>
      <th scope="col">sno</th>
      <th scope="col">titile</th>
      <th scope="col">date</th>
      <th scope="col">author</th>
      <th scope="col">edit</th>
      <th scope="col">delete</th>
    </tr>
  </thead>
  <tbody>
    {% for post in post %}
    <tr>
      <td>{{post.sno}}</td>
      <td>{{post.title}}</td>
      <td>{{post.date}}</td>
      <td>{{post.author}}</td>
      <td><a href="/edit/{{post.sno}}"><button class="btn btn-primary">Edit</button></a></td>
      <td><button class="btn btn-primary">Delete</button></td>
    </tr>
   {% endfor %}
  </tbody>
</table>
        {%endblock%}
