{%extends "layout.html"%}
{%block body%}
<header class="masthead" style="background-image: url('{{ url_for('static', filename='assets/img/admin-bg.jpg') }}')">
            <div class="container position-relative px-4 px-lg-5">
                <div class="row gx-4 gx-lg-5 justify-content-center">
                    <div class="col-md-10 col-lg-8 col-xl-7">
                        <div class="site-heading">
                            <h1>ADMIN PANEL</h1>
                            <span class="subheading">Thoughts worth sharing,Stories worth reading</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <!-- Main Content-->


        <div class="container px-4 px-lg-5">
            <div class="row gx-4 gx-lg-5 justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-7">
                    <!-- Post preview-->
<div>
    <h3>Post new files</h3>
<a href=" /edit/0 "><button class="btn btn-primary">Add a new post</button></a>
<hr>
 </div>



<h3>Edit Files</h3>
<table class="table">
  <thead>
    <tr>
      <th scope="col">S.no</th>
      <th scope="col">Titile</th>
      <th scope="col">Date</th>
      <th scope="col">Author</th>
      <th scope="col">Edit</th>
      <th scope="col">Delete</th>
    </tr>
  </thead>
  <tbody>
    {% for post in post %}
    <tr>
      <td>{{post.sno}}</td>
      <td>{{post.title}}</td>
      <td>{{post.date}}</td>
      <td>{{post.author}}</td>
      <td><a href="/edit/{{post.sno}}"><button class="btn btn-primary">Edit</button></a></td>
      <td><a href="/delete/{{post.sno}}"><button class="btn btn-primary">Delete</button></a></td>
    </tr>
   {% endfor %}
  </tbody>
</table>

<h3>Upload file</h3>
<form action="{{ url_for('uploader') }}" method="POST" enctype="multipart/form-data">
    <label>Select file:</label>
    <input type="file" name="file1" required>
    <input type="submit" value="Upload">
</form>
<hr>
<div class="clearly-fix mb-4">
<a href="{{ url_for('logout') }}" class="btn btn-primary">
    Log out
</a>

</div>
        {%endblock%}
